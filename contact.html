<section class="contact" id="contact">
        <h2 class="heading">Contactez <span>moi</span></h2>
        <!-- Formulaire prêt pour Formspree (remplacez l'ID dans action par votre ID réel) -->
        <form id="contactForm" method="POST" action="https://formspree.io/f/xeoyzwrk">
            <input type="hidden" name="_subject" value="Nouveau message depuis le portfolio">
            <input type="hidden" name="_next" value="https://jauresmas.github.io/portfolio/?submitted=1">
            <!-- Honeypot anti-spam (laisser vide) -->
            <input type="text" name="_gotcha" id="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

            <div class="input-box">
                <input type="text" name="name" placeholder="Nom" required>
                <input type="email" name="_replyto" placeholder="Email" required>
                <input type="tel" name="phone" placeholder="Téléphone">
                <input type="text" name="subject" placeholder="Sujet">
            </div>

            <textarea name="message" id="message" cols="30" rows="10" placeholder="Votre Message" required></textarea>
            <input type="submit" value="Envoyer" class="btn">
            <div id="formStatus" aria-live="polite" style="margin-top:12px;color:var(--text-color)"></div>
        </form>
    </section>

    <footer class="footer">
